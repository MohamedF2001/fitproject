<html class="dark" lang="fr"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/><link href="https://fonts.googleapis.com" rel="preconnect"/><link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&amp;display=swap" rel="stylesheet"/><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/><style>@layer base{html,body{width:100vw;margin:0;padding:0;background-color:#111316;}body{overscroll-behavior:none;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { colors: { "on-primary-container": "#556d00", "tertiary": "#ffffff", "on-secondary": "#00354a", "inverse-primary": "#506600", "on-tertiary-fixed-variant": "#39485a", "surface-container-high": "#282a2d", "on-tertiary-fixed": "#0d1c2d", "on-primary": "#283500", "secondary": "#7bd0ff", "surface-container-low": "#1a1c1f", "on-error": "#690005", "background": "#111316", "primary-fixed": "#c3f400", "on-error-container": "#ffdad6", "tertiary-fixed": "#d4e4fa", "on-secondary-fixed-variant": "#004c69", "surface": "#111316", "outline-variant": "#444933", "on-tertiary": "#233143", "primary-fixed-dim": "#abd600", "primary-container": "#c3f400", "on-secondary-fixed": "#001e2c", "surface-bright": "#37393d", "on-background": "#e2e2e6", "surface-container": "#1e2023", "primary": "#ffffff", "outline": "#8e9379", "error": "#ffb4ab", "on-tertiary-container": "#576679", "tertiary-container": "#d4e4fa", "surface-container-lowest": "#0c0e11", "secondary-fixed-dim": "#7bd0ff", "on-secondary-container": "#00374d", "on-surface-variant": "#c4c9ac", "secondary-container": "#00a6e0", "inverse-surface": "#e2e2e6", "tertiary-fixed-dim": "#b9c8de", "error-container": "#93000a", "on-primary-fixed": "#161e00", "on-surface": "#e2e2e6", "inverse-on-surface": "#2f3034", "surface-container-highest": "#333538", "on-primary-fixed-variant": "#3c4d00", "surface-tint": "#abd600", "secondary-fixed": "#c4e7ff", "surface-variant": "#333538", "surface-dim": "#111316" }, borderRadius: { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" }, spacing: { "space-xl": "2rem", "space-sm": "0.5rem", "gutter": "1rem", "space-lg": "1.5rem", "space-xs": "0.25rem", "space-md": "1rem", "margin": "1.25rem" }, fontFamily: { "body-lg": ["Plus Jakarta Sans"], "label-mono-stat": ["Plus Jakarta Sans"], "body-md": ["Plus Jakarta Sans"], "metric-display-mobile": ["Plus Jakarta Sans"], "headline-xl": ["Plus Jakarta Sans"], "headline-md": ["Plus Jakarta Sans"], "label-lg": ["Plus Jakarta Sans"], "label-md": ["Plus Jakarta Sans"], "headline-lg": ["Plus Jakarta Sans"], "metric-display": ["Plus Jakarta Sans"] }, fontSize: { "body-lg": ["16px", { "lineHeight": "24px", "letterSpacing": "0em", "fontWeight": "400" }], "label-mono-stat": ["11px", { "lineHeight": "14px", "letterSpacing": "0.08em", "fontWeight": "700" }], "body-md": ["14px", { "lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "400" }], "metric-display-mobile": ["40px", { "lineHeight": "44px", "letterSpacing": "-0.03em", "fontWeight": "800" }], "headline-xl": ["32px", { "lineHeight": "38px", "letterSpacing": "-0.02em", "fontWeight": "700" }], "headline-md": ["20px", { "lineHeight": "26px", "letterSpacing": "0em", "fontWeight": "600" }], "label-lg": ["14px", { "lineHeight": "18px", "letterSpacing": "0.02em", "fontWeight": "600" }], "label-md": ["12px", { "lineHeight": "16px", "letterSpacing": "0.04em", "fontWeight": "600" }], "headline-lg": ["24px", { "lineHeight": "30px", "letterSpacing": "-0.01em", "fontWeight": "700" }], "metric-display": ["48px", { "lineHeight": "52px", "letterSpacing": "-0.03em", "fontWeight": "800" }] } } } };</script></head><body class="bg-surface text-on-surface font-body-md text-body-md min-h-screen flex flex-col selection:bg-primary-container selection:text-on-primary"><header class="fixed top-0 w-full z-50 pt-safe bg-surface/80 backdrop-blur-xl shadow-[0_1px_8px_rgba(0,0,0,0.04)]"><div class="h-16 px-margin flex items-center justify-between"><button aria-label="Retour" class="w-11 h-11 flex items-center justify-center rounded-full bg-surface-container-high text-on-surface hover:text-primary transition-colors" onclick="history.back()"><span class="material-symbols-outlined text-[20px]">arrow_back_ios_new</span></button><div class="flex items-center gap-space-xs"><span class="text-primary-container font-headline-lg text-headline-lg tracking-tight uppercase">FitTrack</span><span class="material-symbols-outlined text-primary-container animate-pulse text-[20px]">bolt</span></div><div class="w-11 h-11"></div></div></header><main class="flex-1 w-full bg-surface pt-16 pb-safe px-margin flex flex-col relative"><div class="flex flex-col w-full pb-8">
<!-- Brand Intro & Logo Hero -->
<div class="flex flex-col items-center text-center mt-2 mb-6">
<div class="relative flex items-center justify-center mb-4">
<div class="absolute w-20 h-20 rounded-full bg-primary-container/20 blur-xl"></div>
<img alt="FitTrack Logo" class="w-16 h-16 relative z-10 rounded-[18px] shadow-lg" src="https://lh3.googleusercontent.com/aida/AEtjO1VR4EYup0F6RfCh34wrck-6x-TMX_21Zq75ZOUjtkqSftktAy5Op6gh47Xq6RVJeJ33LLUqKr-Fa4KkJz5MLPDh7-W-Ip_HgvQdwfjT9pbveey-z3fC5WmDhc29RJ7YNJRhU8wse6CwHVmksYtbZKzfMqiITSprsHpSZudOwxt9Eey5TWQio1bU5Ythsu6RZfXr92isAsHWW_xadf3EgFQ7QK_gj3bKgt0wBnpJFduEWjlkxG8z_6o-4F2C"/>
</div>
<div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-surface-container-high mb-2">
<span class="w-2 h-2 rounded-full bg-primary-container animate-pulse"></span>
<span class="text-on-surface-variant font-label-mono-stat text-label-mono-stat uppercase tracking-wider">Performance Lab</span>
</div>
<h1 class="font-headline-lg text-headline-lg text-on-surface tracking-tight">
      Dépassez vos limites <span class="text-primary-container">dès aujourd'hui.</span>
</h1>
<p class="font-body-md text-body-md text-on-surface-variant mt-1.5 max-w-[280px]">
      Précision technique, suivi millimétré et force brute.
    </p>
</div>
<!-- Segmented Control Tab Switcher -->
<div class="relative p-1 rounded-full bg-surface-container-low flex items-center mb-6 shadow-inner">
<div class="absolute top-1 bottom-1 left-1 w-[calc(50%-4px)] rounded-full bg-surface-container-highest transition-all duration-300 ease-out shadow-sm" id="tabIndicator"></div>
<button class="relative z-10 flex-1 py-2.5 text-center font-label-lg text-label-lg text-primary transition-colors duration-200" id="loginTabBtn" onclick="switchAuthMode('login')">
      Se connecter
    </button>
<button class="relative z-10 flex-1 py-2.5 text-center font-label-lg text-label-lg text-on-surface-variant transition-colors duration-200" id="registerTabBtn" onclick="switchAuthMode('register')">
      Créer un compte
    </button>
</div>
<!-- Authentication Card -->
<div class="bg-surface-container rounded-[18px] p-space-lg shadow-xl relative overflow-hidden">
<div class="absolute -top-16 -right-16 w-36 h-36 rounded-full bg-primary-container/5 blur-2xl pointer-events-none"></div>
<form class="flex flex-col gap-space-md relative z-10" id="authForm" onsubmit="event.preventDefault(); handleAuthSubmit();">
<!-- Name Field (Visible for Register Mode) -->
<div class="hidden flex-col gap-1.5 transition-all" id="nameFieldGroup">
<label class="font-label-md text-label-md text-on-surface-variant flex items-center justify-between" for="fullName">
<span>Nom complet</span>
<span class="font-label-mono-stat text-label-mono-stat text-outline">ATHLÈTE</span>
</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3.5 text-outline text-[20px] pointer-events-none">person</span>
<input class="w-full h-12 pl-11 pr-4 bg-surface-container-low text-on-surface font-body-md text-body-md rounded-xl placeholder:text-outline/60 focus:outline-none focus:bg-surface-container-high transition-colors" id="fullName" placeholder="Ibrahim Traoré" type="text"/>
</div>
</div>
<!-- Email Field -->
<div class="flex flex-col gap-1.5">
<label class="font-label-md text-label-md text-on-surface-variant flex items-center justify-between" for="email">
<span>Identifiant Email</span>
<span class="font-label-mono-stat text-label-mono-stat text-outline">REQUIS</span>
</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3.5 text-outline text-[20px] pointer-events-none">alternate_email</span>
<input class="w-full h-12 pl-11 pr-4 bg-surface-container-low text-on-surface font-body-md text-body-md rounded-xl placeholder:text-outline/60 focus:outline-none focus:bg-surface-container-high transition-colors" id="email" placeholder="ibrahim@exemple.com" required="" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="flex flex-col gap-1.5">
<div class="flex items-center justify-between">
<label class="font-label-md text-label-md text-on-surface-variant" for="password">
            Mot de passe
          </label>
<button class="font-label-md text-label-md text-primary-container hover:underline" id="forgotPwdBtn" onclick="handleForgotPassword()" type="button">
            Mot de passe oublié ?
          </button>
</div>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3.5 text-outline text-[20px] pointer-events-none">lock</span>
<input class="w-full h-12 pl-11 pr-11 bg-surface-container-low text-on-surface font-body-md text-body-md rounded-xl placeholder:text-outline/60 focus:outline-none focus:bg-surface-container-high transition-colors" id="password" placeholder="••••••••••••" required="" type="password"/>
<button aria-label="Afficher ou masquer le mot de passe" class="absolute right-2 w-9 h-9 flex items-center justify-center text-outline hover:text-on-surface transition-colors" onclick="togglePasswordVisibility()" type="button">
<span class="material-symbols-outlined text-[20px]" id="pwdToggleIcon">visibility</span>
</button>
</div>
</div>
<!-- Submit CTA Button -->
<button class="w-full h-[52px] mt-2 rounded-full bg-primary-container text-on-primary font-label-lg text-label-lg uppercase tracking-wide flex items-center justify-center gap-2 active:scale-[0.98] transition-transform shadow-[0_8px_24px_rgba(204,255,0,0.22)]" id="submitBtn" type="submit">
<span id="submitBtnText">Se connecter à FitTrack</span>
<span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
</form>
<!-- Stylized Separator -->
<div class="relative flex items-center justify-center my-6">
<div class="w-full h-[1px] bg-surface-container-highest"></div>
<span class="absolute px-3 bg-surface-container text-outline font-label-mono-stat text-label-mono-stat uppercase tracking-wider">
        ou continuer avec
      </span>
</div>
<!-- Social Auth Quick Connect -->
<div class="grid grid-cols-2 gap-space-sm">
<button class="h-12 rounded-xl bg-surface-container-high hover:bg-surface-container-highest flex items-center justify-center gap-2 text-on-surface font-label-md text-label-md active:scale-95 transition-all" onclick="simulateSocialLogin('Google')" type="button">
<svg class="w-4 h-4" viewbox="0 0 24 24">
<path d="M12 5c1.6 0 3 .6 4.1 1.7l3.1-3.1C17.3 1.8 14.8 1 12 1 7.5 1 3.7 3.6 1.9 7.4l3.7 2.9C6.5 7.4 9 5 12 5z" fill="#EA4335"></path>
<path d="M23.5 12.3c0-.8-.1-1.7-.2-2.3H12v4.6h6.5c-.3 1.5-1.1 2.8-2.4 3.7l3.7 2.9c2.2-2 3.7-5 3.7-8.9z" fill="#4285F4"></path>
<path d="M5.6 14.7c-.2-.7-.4-1.5-.4-2.7s.1-2 .4-2.7L1.9 6.4C.7 8.8 0 10.3 0 12s.7 3.2 1.9 5.6l3.7-2.9z" fill="#FBBC05"></path>
<path d="M12 23c3.2 0 6-1.1 8-3l-3.7-2.9c-1.1.7-2.5 1.2-4.3 1.2-3 0-5.5-2.4-6.4-5.3L1.9 16c1.8 3.7 5.6 7 10.1 7z" fill="#34A853"></path>
</svg>
<span>Google</span>
</button>
<button class="h-12 rounded-xl bg-surface-container-high hover:bg-surface-container-highest flex items-center justify-center gap-2 text-on-surface font-label-md text-label-md active:scale-95 transition-all" onclick="simulateSocialLogin('Apple')" type="button">
<svg class="w-4 h-4 fill-current" viewbox="0 0 24 24">
<path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.97 6.37c.66-.8 1.1-1.92.98-3.04-.95.04-2.1.63-2.77 1.42-.59.68-1.11 1.79-.97 2.88 1.05.08 2.12-.54 2.76-1.26z"></path>
</svg>
<span>Apple</span>
</button>
</div>
</div>
<!-- Regional Context / Community Badge -->
<div class="mt-6 flex items-center gap-3 px-4 py-3 rounded-xl bg-surface-container-low">
<div class="w-8 h-8 rounded-lg bg-surface-container-high flex items-center justify-center shrink-0">
<span class="material-symbols-outlined text-primary-container text-[18px]">public</span>
</div>
<p class="font-label-md text-label-md text-on-surface-variant leading-snug">
      Rejoignez la communauté <span class="text-on-surface font-semibold">FitTrack</span> en Afrique de l'Ouest et progressez chaque semaine.
    </p>
</div>
<!-- Bottom Interactive Switch Link -->
<div class="mt-6 text-center">
<button class="font-body-md text-body-md text-on-surface-variant hover:text-primary transition-colors" id="modeTogglePromptBtn" onclick="toggleModeFromFooter()" type="button">
      Pas encore de compte ? <span class="text-primary-container font-semibold">S'inscrire gratuitement</span>
</button>
</div>
<!-- Feedback Toast Notification Area -->
<div class="fixed bottom-6 left-1/2 -translate-x-1/2 px-4 py-2.5 rounded-full bg-surface-container-highest text-on-surface font-label-md text-label-md shadow-2xl opacity-0 pointer-events-none transition-all duration-300 flex items-center gap-2 z-50" id="actionToast">
<span class="material-symbols-outlined text-primary-container text-[18px]">info</span>
<span id="toastMessage">Connexion en cours...</span>
</div>
</div>
<script>
  let currentAuthMode = 'login';

  function switchAuthMode(mode) {
    currentAuthMode = mode;
    const tabIndicator = document.getElementById('tabIndicator');
    const loginTabBtn = document.getElementById('loginTabBtn');
    const registerTabBtn = document.getElementById('registerTabBtn');
    const nameFieldGroup = document.getElementById('nameFieldGroup');
    const forgotPwdBtn = document.getElementById('forgotPwdBtn');
    const submitBtnText = document.getElementById('submitBtnText');
    const modeTogglePromptBtn = document.getElementById('modeTogglePromptBtn');

    if (mode === 'login') {
      tabIndicator.style.left = '4px';
      loginTabBtn.classList.add('text-primary');
      loginTabBtn.classList.remove('text-on-surface-variant');
      registerTabBtn.classList.remove('text-primary');
      registerTabBtn.classList.add('text-on-surface-variant');

      nameFieldGroup.classList.add('hidden');
      forgotPwdBtn.classList.remove('invisible');
      submitBtnText.textContent = 'Se connecter à FitTrack';
      modeTogglePromptBtn.innerHTML = "Pas encore de compte ? <span class=\"text-primary-container font-semibold\">S'inscrire gratuitement</span>";
    } else {
      tabIndicator.style.left = 'calc(50%)';
      registerTabBtn.classList.add('text-primary');
      registerTabBtn.classList.remove('text-on-surface-variant');
      loginTabBtn.classList.remove('text-primary');
      loginTabBtn.classList.add('text-on-surface-variant');

      nameFieldGroup.classList.remove('hidden');
      forgotPwdBtn.classList.add('invisible');
      submitBtnText.textContent = 'Créer mon compte athlète';
      modeTogglePromptBtn.innerHTML = "Déjà membre FitTrack ? <span class=\"text-primary-container font-semibold\">Se connecter</span>";
    }
  }

  function toggleModeFromFooter() {
    switchAuthMode(currentAuthMode === 'login' ? 'register' : 'login');
  }

  function togglePasswordVisibility() {
    const pwdInput = document.getElementById('password');
    const icon = document.getElementById('pwdToggleIcon');
    if (pwdInput.type === 'password') {
      pwdInput.type = 'text';
      icon.textContent = 'visibility_off';
    } else {
      pwdInput.type = 'password';
      icon.textContent = 'visibility';
    }
  }

  function showToast(message) {
    const toast = document.getElementById('actionToast');
    const toastMessage = document.getElementById('toastMessage');
    toastMessage.textContent = message;
    toast.classList.remove('opacity-0', 'pointer-events-none');
    toast.classList.add('opacity-100');

    setTimeout(() => {
      toast.classList.remove('opacity-100');
      toast.classList.add('opacity-0', 'pointer-events-none');
    }, 2800);
  }

  function handleAuthSubmit() {
    const email = document.getElementById('email').value;
    if (currentAuthMode === 'login') {
      showToast(`Connexion réussie : Bienvenue ${email.split('@')[0]} !`);
    } else {
      showToast('Profil athlète créé avec succès !');
    }
  }

  function handleForgotPassword() {
    showToast('Lien de réinitialisation envoyé par SMS/Email.');
  }

  function simulateSocialLogin(provider) {
    showToast(`Connexion via ${provider} sécurisée...`);
  }
</script></main></body></html>
